<!-- Downlodr chat mascot, resting pose (no raised arm — that layer is
     downlodr_mascot_arm.svg, which ChatFab fades in and waves on hover).

     The source art painted the disc twice: a #3A3A3A rect under an embedded
     240x240 PNG that was itself opaque flat #3A3A3A. The PNG has been dropped
     so the disc is a single vector fill in the Downlodr primary orange
     (tailwind theme `primary`, #F45513) — recoloring the rect alone did
     nothing while the opaque bitmap sat on top of it. -->
