name: macOS Build Smoke Test

# Secret-free dry run of the macOS build. Exercises everything the production
# workflow does EXCEPT the keychain import, codesigning, DMG creation and
# notarization -- i.e. every step that does not need an Apple secret.
#
# Manual only — this does not run on ordinary pushes.
#
# GitHub only lists a workflow_dispatch workflow in the Actions UI when the
# file exists on the DEFAULT branch, so a dispatch-only file on a feature
# branch is unrunnable. Until this lands on main, trigger it by pushing a
# throwaway tag:
#
#     git tag preflight-1 && git push origin preflight-1
#
# Re-run later with a fresh tag name (preflight-2, ...), and delete old ones
# with `git push origin :refs/tags/preflight-1`. Once the file is on main the
# workflow_dispatch entry below works from the Actions UI and this tag dance
# can be dropped.

on:
  push:
    tags:
      - "preflight-*"
  workflow_dispatch:
    inputs:
      target_arch:
        description: "Architecture to package"
        required: true
        type: choice
        default: arm64
        options:
          - arm64
          - intel

permissions:
  contents: read

concurrency:
  group: macos-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-unsigned:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      # forge.config.ts gates osxSign on APPLE_IDENTITY && !SKIP_CODE_SIGNING.
      # No secrets are set here, but this makes the unsigned path explicit and
      # also short-circuits the postPackage binary signing.
      SKIP_CODE_SIGNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner facts
        run: |
          echo "uname -m        : $(uname -m)"
          echo "macOS           : $(sw_vers -productVersion)"
          echo "Xcode CLT       : $(xcodebuild -version 2>/dev/null | head -1 || echo 'n/a')"
          echo "free disk       : $(df -h / | awk 'NR==2{print $4}')"
          printf 'create-dmg      : '
          if [ -x /opt/homebrew/bin/create-dmg ]; then
            /opt/homebrew/bin/create-dmg --version 2>&1 | head -1
          else
            echo "NOT INSTALLED (build scripts will fall back to hdiutil)"
          fi
          printf 'Rosetta 2       : '
          if /usr/bin/pgrep -q oahd 2>/dev/null || [ -f /Library/Apple/usr/libexec/oah/libRosettaRuntime ]; then
            echo "present"
          else
            echo "NOT PRESENT (x64 binaries cannot execute on this runner)"
          fi

      # The single most likely cause of a silent production failure:
      # scripts/verify-binaries.sh runs `./binaries/ffmpeg-x64 -version` and
      # exits 1 if it cannot execute. On an arm64 runner without Rosetta 2 that
      # aborts build:dmg before packaging ever starts.
      - name: Can the x64 static binaries execute here?
        continue-on-error: true
        run: |
          chmod +x binaries/* || true
          for b in binaries/ffmpeg-arm64 binaries/ffmpeg-x64 binaries/ffprobe-x64; do
            printf '%-26s ' "$b"
            if ./"$b" -version >/dev/null 2>&1; then
              echo "RUNS -- $(./"$b" -version 2>&1 | head -1)"
            else
              echo "CANNOT EXECUTE"
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Force HTTPS for git dependencies
        # yarn.lock records a "resolved" URL per dependency. Regenerating it on
        # a machine whose git rewrites https:// GitHub URLs to ssh:// bakes
        # ssh://git@github.com/... into the lockfile, and a CI runner has no SSH
        # key -- yarn then dies with "Permission denied (publickey)" during
        # install. Every git dependency here is a public repo, so rewrite back.
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: yarn install --network-timeout 100000 --network-concurrency 1

      - name: Build downlodr-mcp bundle
        run: yarn mcp:setup

      - name: Ensure scripts are executable
        run: chmod +x ./scripts/*.sh

      - name: Refresh static FFmpeg (8.0+)
        continue-on-error: true
        run: bash ./download-static-ffmpeg.sh

      - name: Fetch Whisper model
        run: bash ./scripts/download-whisper-model.sh

      # Reported, not enforced: this is exactly the gate that would abort the
      # real build, so we want to see its verdict without hiding later failures.
      - name: Verify binaries (report only)
        continue-on-error: true
        run: bash ./scripts/verify-binaries.sh

      - name: Package unsigned app
        run: |
          if [ "${{ github.event.inputs.target_arch }}" = "intel" ]; then
            ARCH=x64
          else
            ARCH=arm64
          fi
          echo "Packaging for $ARCH"
          npx electron-forge package --arch="$ARCH"

      - name: Inspect the packaged app
        run: |
          set -e
          APP_PATH=$(find out -maxdepth 3 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle produced under out/"
            ls -la out/ || true
            exit 1
          fi
          echo "App bundle: $APP_PATH ($(du -sh "$APP_PATH" | cut -f1))"
          RES="$APP_PATH/Contents/Resources"

          echo ""
          echo "--- Resources ---"
          ls -lh "$RES" | head -40

          echo ""
          echo "--- required payload ---"
          missing=0
          for f in ggml-small.bin ffmpeg-arm64 ffmpeg-x64 yt-dlp yt-dlp_macos; do
            printf '%-20s ' "$f"
            if [ -e "$RES/$f" ]; then
              echo "present ($(du -h "$RES/$f" | cut -f1))"
            else
              echo "MISSING"
              missing=1
            fi
          done

          echo ""
          echo "--- app.asar size (should NOT contain the mac statics) ---"
          if [ -f "$RES/app.asar" ]; then
            ASAR_MB=$(( $(stat -f%z "$RES/app.asar") / 1048576 ))
            echo "app.asar: ${ASAR_MB}MB"
            if [ "$ASAR_MB" -gt 400 ]; then
              echo "app.asar is suspiciously large -- binaries/ may be leaking into it"
              missing=1
            fi
          fi

          echo ""
          if [ "$missing" -ne 0 ]; then
            echo "Smoke test FAILED: packaged app is missing required payload."
            exit 1
          fi
          echo "Smoke test passed: unsigned app packaged with full payload."

      # Zip with ditto, NOT with upload-artifact's own zipping. A .app bundle
      # contains symlinks (Contents/Frameworks/...) and executable permission
      # bits, and actions/upload-artifact preserves neither -- an .app uploaded
      # as a directory arrives on the tester's Mac as a broken bundle that will
      # not launch. ditto -c -k --keepParent writes the same archive format
      # Finder's "Compress" produces, which unpacks back into a working app.
      #
      # Runs before the launch step on purpose: if the app crashes on startup,
      # the artifact is already uploaded and can be debugged on a real Mac.
      - name: Archive the app for download
        run: |
          set -uo pipefail

          APP_PATH="$(find out -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle to archive"
            exit 1
          fi

          ZIP="$RUNNER_TEMP/Downlodr-macos-arm64-unsigned.zip"
          echo "Archiving $APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          ls -lh "$ZIP"

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Downlodr-macos-arm64-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/Downlodr-macos-arm64-unsigned.zip
          retention-days: 7
          if-no-files-found: error

      # Can the app REACH its binaries? The payload check above proves the
      # files are in Resources; it says nothing about whether the app's own
      # path resolution finds them. Those are different questions, and the
      # gap between them is where the cwd-relative spawn bug lived: yt-dlp
      # sat in Resources the whole time while every call spawned `/yt-dlp_macos`.
      #
      # `--preflight` runs the real resolver, spawns each binary, prints what
      # it found and exits 0/1 — before any window or database is opened.
      - name: Preflight — can the app reach yt-dlp and FFmpeg?
        run: |
          set -uo pipefail

          APP_PATH="$(find out -maxdepth 3 -type d -name '*.app' -print -quit)"
          BIN="$APP_PATH/Contents/MacOS/Downlodr"
          LOG="$RUNNER_TEMP/downlodr-preflight.log"

          # 5 min: the version probes take seconds, but the live metadata
          # fetch has its own 60s timeout and the runner can be slow to start
          # Electron cold.
          ELECTRON_ENABLE_LOGGING=1 "$BIN" --preflight > "$LOG" 2>&1 &
          PID=$!
          ( sleep 300; kill -9 "$PID" 2>/dev/null ) & WATCHDOG=$!
          wait "$PID"; RESULT=$?
          kill "$WATCHDOG" 2>/dev/null || true

          echo "--- preflight output ---"
          cat "$LOG" 2>/dev/null || echo "(no output captured)"
          echo ""

          # The `metadata WARN` line is deliberately NOT fatal — it depends on
          # the network and on YouTube not blocking the runner, so it reports
          # without deciding the build. Only the binary probes gate this step.
          if [ "$RESULT" -ne 0 ]; then
            echo "Preflight FAILED: the packaged app cannot reach one or more binaries."
          else
            echo "Preflight passed: every binary is reachable from the packaged app."
          fi
          exit "$RESULT"

      # Does it actually start? Packaging proves the payload is in place; it
      # says nothing about whether the app survives its own startup path
      # (native module load, DB open, IPC registration). The runner has a GUI
      # session, so an Electron app can really launch here. The bundle is not
      # quarantined (nothing downloaded it), so Gatekeeper does not block an
      # unsigned launch from the build directory.
      - name: Launch the packaged app
        run: |
          set -uo pipefail

          APP_PATH="$(find out -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle produced under out/"
            find out -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi

          BIN="$APP_PATH/Contents/MacOS/Downlodr"
          LOG="$RUNNER_TEMP/downlodr-app.log"

          if [ ! -x "$BIN" ]; then
            echo "No executable at $BIN"
            ls -la "$APP_PATH/Contents/MacOS" || true
            exit 1
          fi

          echo "Launching $BIN"
          ELECTRON_ENABLE_LOGGING=1 "$BIN" > "$LOG" 2>&1 &
          PID=$!

          # 30s is well past first-paint for this app; anything fatal in the
          # startup path (missing native module, DB failure) aborts far sooner.
          sleep 30

          if kill -0 "$PID" 2>/dev/null; then
            echo ""
            echo "App still alive after 30s (pid $PID) — it started cleanly."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            RESULT=0
          else
            wait "$PID"
            CODE=$?
            echo ""
            echo "App exited on its own in under 30s (exit code $CODE)."
            RESULT=1
          fi

          echo ""
          echo "--- app stdout/stderr ---"
          cat "$LOG" 2>/dev/null || echo "(no output captured)"

          exit "$RESULT"
