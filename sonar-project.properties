# SonarQube project configuration

# --- Required properties ---
# Unique project key
sonar.projectKey=Downlodr

# Project display name
sonar.projectName=Downloadr

# Project version
sonar.projectVersion=1.7.2-stable

# --- Paths to sources and binaries ---
# Path to the source code of your project
sonar.sources=src

# Path to the compiled classes (binaries)
# sonar.java.binaries=target/classes

# --- SonarQube server ---
# URL of your SonarQube server
sonar.host.url=http://localhost:9000
# Token configured via SONAR_TOKEN environment variable for security

# --- Encoding ---
# Encoding of the source code
sonar.sourceEncoding=UTF-8
